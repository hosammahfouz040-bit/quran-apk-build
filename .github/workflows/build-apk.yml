
name: Build Quran APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          unzip -o noor-al-quran-app-foundation.zip -d extracted

          PROJECT_DIR="$(dirname "$(find extracted -name package.json -print -quit)")"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install and build web app
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm run build

      - name: Prepare Capacitor
        run: |
          cd "$PROJECT_DIR"

          npm install @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/android@8.5.3

          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            printf '{"appId":"com.quran.app","appName":"Quran","webDir":"dist"}' > capacitor.config.json
          fi

          if [ ! -d android ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            rm -rf android
            npx cap add android
          fi

          npx cap sync android

      - name: Verify Gradle Wrapper
        run: |
          cd "$PROJECT_DIR/android"

          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: Gradle Wrapper files are missing"
            exit 1
          fi

          chmod +x gradlew

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR/android"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
